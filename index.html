<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calçados Femininos</title>
    <style>
        :root {
            --cor-principal: #800020;
            --cor-secundaria: #a52a4a;
            --cor-clara: #f8e8ec;
            --cor-escura: #4b0013;
            --cor-branca: #ffffff;
        }
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--cor-clara);
            color: var(--cor-escura);
        }
        header {
            background-color: var(--cor-principal);
            color: var(--cor-branca);
            text-align: center;
            padding: 30px;
        }
        main {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        /* ESCONDE OS BOTÕES DE RADIO */
        input[type="radio"] {
            display: none;
        }
        /* ÁREA VISÍVEL DO CARROSSEL */
        .carrossel {
            overflow: hidden;
            border: 5px solid var(--cor-principal);
            border-radius: 15px;
        }
        /* CONJUNTO DOS SLIDES */
        .slides {
            display: flex;
            width: 500%;
            transition: transform 0.5s ease;
        }
        /* CADA SLIDE */
        .slide {
            width: 20%;
            flex-shrink: 0;
        }
        .slide img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
        }
        .slide figcaption {
            background-color: var(--cor-principal);
            color: white;
            text-align: center;
            padding: 15px;
        }
        /* MOVIMENTAÇÃO DOS SLIDES */
        #slide1:checked~.carrossel .slides {
            transform: translateX(0);
        }
        #slide2:checked ~.carrossel .slides {
            transform: translateX(-20%);
        }
        #slide3:checked ~.carrossel .slides {
            transform: translateX(-40%);
        }
        #slide4:checked ~.carrossel .slides {
            transform: translateX(-60%);
        }
        #slide5:checked ~.carrossel .slides {
            transform: translateX(-80%);
        }
        /* BOTÕES */
        .botoes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .botoes label {
            width: 20px;
            height: 20px;
            background-color: var(--cor-secundaria);
            border-radius: 50%;
            cursor: pointer;
        }
        .botoes label:hover {
            background-color: var(--cor-escura);
        }
        footer {
            background-color: var(--cor-escura);
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }
        /* CELULAR */
        @media (max-width: 700px) {
            .slide img {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Calçados Femininos</h1>
        <p>A sua melhor escolha em conforto e estilo</p>
    </header>
    <main>
        <h2>Conheça nossos modelos</h2>
        <!-- BOTÕES INVISÍVEIS -->
        <input type="radio" name="carrossel" id="slide1" checked>
        <input type="radio" name="carrossel" id="slide2">
        <input type="radio" name="carrossel" id="slide3">
        <input type="radio" name="carrossel" id="slide4">
        <input type="radio" name="carrossel" id="slide5">
        
        <!-- CARROSSEL -->
        <section class="carrossel">
            <div class="slides">
                <figure class="slide">
                    <img src="https://assets.adidas.com/images/w_500,f_auto,q_auto/afc2b8818ea449eaac8056a61efec822_9366/Tenis_adidas_Sleek_Prata_JQ2584_01_00_standard.jpg" alt="Tênis Adidas Feminino">
                    <figcaption>
                        Tênis Adidas Feminino: Design moderno e tecnologia de amortecimento.
                    </figcaption>
                </figure>
                <figure class="slide">
                    <img src="https://imgnike-a.akamaihd.net/1920x1920/06088253.jpg" alt="Tênis Nike Feminino">
                    <figcaption>
                        Tênis Nike Feminino: Performance e estilo para o seu dia a dia.
                    </figcaption>
                </figure>
                <figure class="slide">
                    <img src="https://images.tcdn.com.br/img/img_prod/1317970/tenis_adidas_feminino_casual_branco_rosa_brilho_metalico_66747_1_25dafc79f58c0b513da0c9acb8eb2f4d.jpg" alt="Tênis Feminino Exclusivo">
                    <figcaption>
                        Tênis Feminino Casual: Elegância e conforto absoluto para todos os momentos.
                    </figcaption>
                </figure>
                <figure class="slide">
                    <img src="https://grupooscar.vtexassets.com/arquivos/ids/10983280/999999992729000_1.webp?v=639118782718500000" alt="Tênis Urbano">
                    <figcaption>
                         Tênis Esportivo Feminino: Leveza e desempenho para o teu estilo ativo.
                    </figcaption>
                </figure>
                <figure class="slide">
                    <!-- Última foto alterada para tênis feminino -->
                    <img src="https://imgcentauro-a.akamaihd.net/1300x1300/97360651A9.jpg"alt="Tênis Feminino Esportivo">
                    <figcaption>
                       Linha Casual: O toque perfeito de atitude para o seu visual.
                    </figcaption>
                </figure>
            </div>
        </section>
        
        <!-- BOTÕES VISÍVEIS -->
        <div class="botoes">
            <label for="slide1"></label>
            <label for="slide2"></label>
            <label for="slide3"></label>
            <label for="slide4"></label>
            <label for="slide5"></label>
        </div>
    </main>
    <footer>
        <p>Calçado Feminino </p>
    </footer>
</body>
</html>
